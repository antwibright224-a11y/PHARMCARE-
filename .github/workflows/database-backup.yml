name: Encrypted PostgreSQL backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out backup script
        uses: actions/checkout@v4
      - name: Install PostgreSQL tools and GnuPG
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client gnupg
      - name: Create and verify encrypted backup
        env:
          DATABASE_URL: ${{ secrets.PHARMACARE_BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.PHARMACARE_BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUTPUT_DIR: backups
        run: bash scripts/backup-postgres.sh
      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v7
        with:
          name: pharmacare-postgres-backup-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 30
